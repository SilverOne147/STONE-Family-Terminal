<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STONE FAMILY — Терминал Контрактов</title>
<style>
  :root {
    --bg-dark: #0F1A26; --bg-panel: #1A2B3C; --bg-panel-2: #22384F;
    --orange: #E64A19; --orange-light: #FF7043; --text: #FFFFFF;
    --text-muted: #A0B4C8; --green: #4CAF50; --red: #E53935; --blue: #2196F3;
    --input-bg: #FFCCBC; --input-text: #3E2723;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text); min-height: 100vh; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  
  .card { background: var(--bg-panel); border-radius: 10px; padding: 25px; width: 100%; max-width: 500px; border-top: 4px solid var(--orange); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .card h2 { font-size: 20px; color: var(--orange-light); margin-bottom: 20px; text-transform: uppercase; text-align: center; letter-spacing: 1px; }
  
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
  
  input, select, textarea { background: var(--input-bg); color: var(--input-text); border: none; padding: 12px; border-radius: 6px; font-size: 14px; width: 100%; font-family: inherit; font-weight: 500; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--orange-light); }
  
  /* Зона для загрузки картинки */
  .upload-zone { border: 2px dashed var(--orange); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: background 0.2s; background: rgba(230, 74, 25, 0.05); position: relative; }
  .upload-zone:hover { background: rgba(230, 74, 25, 0.15); }
  .upload-zone p { color: var(--text-muted); font-size: 13px; margin-top: 5px; }
  .upload-zone .icon { font-size: 32px; }
  .preview-image { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 10px; display: none; }
  
  .btn { background: var(--orange); color: var(--text); border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px; width: 100%; margin-top: 10px; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn:hover { background: var(--orange-light); }
  .btn:disabled { background: var(--text-muted); cursor: not-allowed; }
  .btn-secondary { background: var(--bg-panel-2); border: 1px solid var(--text-muted); font-size: 14px; margin-top: 5px; }
  
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--orange); color: white; padding: 12px 20px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10000; font-weight: 600; }
  .toast.show { opacity: 1; }
  
  .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--orange); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card" id="main-card">
  <h2>📝 Сдать отчет</h2>
  
  <div class="form-group">
    <label>Ваш Статик</label>
    <input type="text" id="userStatic" placeholder="Например: 376117" maxlength="6">
  </div>

  <div class="form-group">
    <label>Направление контракта</label>
    <select id="direction" onchange="updateActions()">
      <option value="goods">✈️ Товары с самолёта</option>
      <option value="metallurgy">⛏️ Металлургия</option>
      <option value="atelier">👗 Ателье</option>
    </select>
  </div>

  <div class="form-group">
    <label>Действие</label>
    <select id="action" onchange="updateActions()">
      <option value="activate">✅ Активировал</option>
      <option value="loaded">📦 Погрузил</option>
      <option value="deliver">🚛 Доставил</option>
      <option value="close">🤑 Закрыл контракт</option>
    </select>
  </div>

  <div class="form-group" id="comment-group" style="display:none;">
    <label>Кто помогал грузить? (через запятую)</label>
    <input type="text" id="comment" placeholder="Например: Vitoha, Moon">
  </div>

  <div class="form-group">
    <label>Доказательство (Скриншот)</label>
    <div class="upload-zone" onclick="document.getElementById('proofImage').click()">
      <div class="icon">📸</div>
      <p>Нажмите, чтобы выбрать файл<br>или вставьте из буфера (Ctrl+V)</p>
      <img id="preview" class="preview-image" src="" alt="Превью">
    </div>
    <input type="file" id="proofImage" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
    <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Вставить из буфера</button>
  </div>

  <button class="btn" id="submit-btn" onclick="sendReport()">
    <span id="btn-text">Отправить отчет</span>
    <div class="loader" id="btn-loader"></div>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// НАСТРОЙКИ (ВСТАВЬ СВОИ КЛЮЧИ СЮДА)
// ============================================================
const CONFIG = {
  IMGBB_API_KEY: '6027668279e35441432ad63f253d530c',
  WEBHOOKS: {
    goods: 'https://discord.com/api/webhooks/1574866245726109830/uKK-mnfBWP4Gev7q93Qy9-lhm1W_9BcJ44TUJy68g2HnhUp-HeVexGTwQ6k-EeUR1xBx', 
    metallurgy: 'https://discord.com/api/webhooks/1574849467574648995/eNmn5kgQjV_8PBFLtEBeWDeUIvXLGnvdhKMWitTVQ_L_gd-yR1SWK7JSeQDnuHrASrhU',
    atelier: 'https://discord.com/api/webhooks/1574866549691654285/EAzoMc1JUA535pM5s1m7N6P42utZV-DbkFdTmon-bf56xBOPcFK7yNC_THS12FXYFnSk'
  }
};

// Дословные тексты из кода бота
const MESSAGES = {
  goods: {
    name: 'Товары с самолета',
    channelRole: '<@&1517184471475163192>',
    activate: {
      title: 'Контракт "Товары с самолета" активирован!',
      desc: 'потратил **16.000$** и активировал контракт 😎',
      color: 'ff0000',
      fields: [{ name: 'Сколько платят?', value: '- за погрузку товаров можно заработать до 40.000$\n- за сдачу дают 34.080$', inline: true }]
    },
    loaded: {
      title: 'Товары погружены! 🫡',
      desc: 'сжал булки и закинул все коробки в вертолет! 😱',
      color: '0000ff',
      fields: []
    },
    deliver: {
      title: 'Товар доставлен! 🫡',
      desc: 'доставил(а) **32** коробок! 🦾',
      color: 'ffa600',
      fields: []
    },
    close: {
      title: 'Контракт "Товары с самолета" завершен! 🤩',
      desc: 'привез последнюю партию коробок! 😎 Он остановил это безумие! Спасибо ему! 🥳',
      color: '00ff00',
      fields: []
    }
  },
  metallurgy: {
    name: 'Металлургия',
    channelRole: '<@&1517184471475163192>',
    activate: {
      title: 'Контракт "Металлургия IV" активирован!',
      desc: 'потратил **16.000$** и активировал контракт 😎',
      color: 'ff0000',
      fields: [{ name: 'Сколько платят?', value: '- за доставку **железа** - 14.000$\n- за доставку **серебра** - 21.000$\n- за доставку **золота** - 23.000$\n- за доставку **меди** - 24.000$\n- за доставку **олова** - 25.000$', inline: true }]
    },
    loaded: null, // В боте не было отдельной кнопки для металлургии
    deliver: {
      title: 'Руда доставлена! 🫡',
      desc: 'доставил(а) мешочек руды! 👷‍♂️',
      color: 'ffa600',
      fields: []
    },
    close: {
      title: 'Контракт "Металлургия IV" завершен! 🤩',
      desc: 'привез последнюю груду руды! 😎 Нам больше не придется ковырять землю ногтями! Спасибо ему! 🥳',
      color: '00ff00',
      fields: []
    }
  },
  atelier: {
    name: 'Ателье',
    channelRole: '<@&1517184471500193907>',
    activate: {
      title: 'Контракт "Ателье V" активирован!',
      desc: 'потратил **10.000$** и активировал контракт 😎',
      color: 'ff0000',
      fields: [
        { name: 'Сколько платят?', value: '- за **1 комплект** пошитой формы (1 шт.) - **1.493$**', inline: false },
        { name: ' ', value: 'А если пошить **всё** в одного, дадут **156.800$** 😱🤑', inline: true }
      ]
    },
    loaded: null,
    deliver: {
      title: 'Товар доставлен! 🫡',
      desc: 'доставил(а) немного формы! 🕵 Фибиби будут довольны...',
      color: 'ffa600',
      fields: []
    },
    close: {
      title: 'Контракт "Ателье V" завершен! 🤩',
      desc: 'довез(ла) последние лоскуты! 🥹 Респект! 😉\n\nБудем надеяться, что на сегодня они от нас отстанут 😮‍💨',
      color: '00ff00',
      fields: []
    }
  }
};

// ============================================================
// ЛОГИКА
// ============================================================
let currentFile = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Обновление действий и полей
function updateActions() {
  const dir = document.getElementById('direction').value;
  const action = document.getElementById('action').value;
  const commentGroup = document.getElementById('comment-group');
  const actionSelect = document.getElementById('action');
  
  // Для Металлургии и Ателье скрываем "Погрузил", так как в боте его не было
  const options = actionSelect.options;
  for (let i = 0; i < options.length; i++) {
    if (options[i].value === 'loaded') {
      options[i].style.display = (dir === 'goods') ? 'block' : 'none';
    }
  }
  
  // Если выбрано "Погрузил", показываем поле для комментариев
  if (action === 'loaded') {
    commentGroup.style.display = 'block';
  } else {
    commentGroup.style.display = 'none';
  }
}

// Обработка выбора файла
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file) {
    currentFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      const preview = document.getElementById('preview');
      preview.src = e.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

// Вставка из буфера
async function pasteFromClipboard() {
  try {
    const clipboardItems = await navigator.clipboard.read();
    for (const item of clipboardItems) {
      for (const type of item.types) {
        if (type.startsWith('image/')) {
          const blob = await item.getType(type);
          currentFile = new File([blob], "clipboard.png", { type: type });
          
          const reader = new FileReader();
          reader.onload = (e) => {
            const preview = document.getElementById('preview');
            preview.src = e.target.result;
            preview.style.display = 'block';
          };
          reader.readAsDataURL(currentFile);
          toast('Картинка вставлена из буфера!');
          return;
        }
      }
    }
    toast('В буфере нет картинки');
  } catch (err) {
    console.error(err);
    toast('Не удалось прочитать буфер. Попробуйте Ctrl+V на странице.');
  }
}

// Слушаем Ctrl+V на всей странице
document.addEventListener('paste', (e) => {
  const items = e.clipboardData.items;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      if (blob) {
        currentFile = blob;
        const reader = new FileReader();
        reader.onload = (event) => {
          const preview = document.getElementById('preview');
          preview.src = event.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(blob);
        toast('Картинка вставлена!');
      }
    }
  }
});

async function sendReport() {
  const userStatic = document.getElementById('userStatic').value.trim();
  const direction = document.getElementById('direction').value;
  const action = document.getElementById('action').value;
  const comment = document.getElementById('comment').value.trim();
  
  if (!userStatic) { toast('Введите ваш Статик'); return; }
  if (!currentFile) { toast('Пожалуйста, прикрепите скриншот!'); return; }
  if (action === 'loaded' && direction !== 'goods') { toast('Это действие только для Товаров'); return; }
  
  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const loader = document.getElementById('btn-loader');
  
  btn.disabled = true;
  btnText.style.display = 'none';
  loader.style.display = 'block';

  try {
    // 1. Загружаем картинку на ImgBB
    const formData = new FormData();
    formData.append('image', currentFile);
    
    const imgRes = await fetch(`https://api.imgbb.com/1/upload?key=${CONFIG.IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });
    
    const imgData = await imgRes.json();
    if (!imgData.success) throw new Error('Ошибка загрузки картинки');
    
    const imageUrl = imgData.data.url;

    // 2. Формируем Embed
    const webhookUrl = CONFIG.WEBHOOKS[direction];
    const msgTemplate = MESSAGES[direction][action];
    
    if (!msgTemplate) throw new Error('Действие недоступно для этого направления');

    const embed = {
      title: msgTemplate.title,
      description: `**${userStatic}** ${msgTemplate.desc}`,
      color: parseInt(msgTemplate.color, 16),
      image: { url: imageUrl },
      footer: { 
        text: 'STONE Famely - Terminal V1.0 | ' + new Date().toLocaleString('ru-RU'),
      }
    };

    // Добавляем поля
    if (msgTemplate.fields && msgTemplate.fields.length > 0) {
      embed.fields = msgTemplate.fields;
    }

    // Специальная логика для "Погрузил" (Товары)
    if (direction === 'goods' && action === 'loaded') {
      if (comment) {
        embed.fields = [
          { name: 'Помогал(а/и):', value: comment, inline: false },
          { name: ' ', value: 'Вам осталось лишь сдать свою партию и получить **34.080$** 🤑', inline: false }
        ];
      } else {
        embed.fields = [
          { name: ' ', value: 'Вам осталось лишь сдать свою партию и получить **34.080$** 🤑', inline: false }
        ];
      }
    }

    // 3. Отправляем
    const payload = {
      content: MESSAGES[direction].channelRole,
      embeds: [embed]
    };

    const discordRes = await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!discordRes.ok) throw new Error('Ошибка отправки в Discord');

    toast('Отчет успешно отправлен!');
    
    // Очищаем форму
    currentFile = null;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('proofImage').value = '';
    document.getElementById('comment').value = '';

  } catch (error) {
    console.error(error);
    toast('Ошибка: ' + error.message);
  } finally {
    btn.disabled = false;
    btnText.style.display = 'block';
    loader.style.display = 'none';
  }
}

// Инициализация при загрузке
updateActions();
</script>
</body>
</html>
